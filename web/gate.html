<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Switchboard">
<meta name="theme-color" content="#181b1d">
<title>Switchboard</title>
<style>
  :root { --bg: #f3f5f4; --card: #fff; --ink: #25292b; --muted: #626b70; --accent: #86c232; --danger: #b3342b; --line: #dde2e0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #181b1d; --card: #222629; --ink: #e7ebe9; --muted: #9aa4a9; --danger: #ff9188; --line: #353b3f; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; }
  h1 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  #msg { margin: 0; }
  #msg.err { color: var(--danger); }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  button { margin-top: 16px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #222629; font: inherit; font-weight: 650; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Switchboard</h1>
  <p id="msg">Checking this phone…</p>
  <p class="hint" id="hint" hidden></p>
  <button id="retry" type="button" hidden>Try again</button>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const say = (text, err, hint) => {
    $('msg').textContent = text; $('msg').className = err ? 'err' : '';
    $('hint').hidden = !hint; $('hint').textContent = hint || '';
    $('retry').hidden = !err;
  };
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const post = async (path, body) => {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}), cache: 'no-store' });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
    return data;
  };

  // The private key never leaves this browser: it is made non-extractable and kept in IndexedDB.
  const store = (mode, fn) => new Promise((ok, bad) => {
    const open = indexedDB.open('switchboard-phone', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('keys');
    open.onerror = () => bad(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('keys', mode);
      const req = fn(tx.objectStore('keys'));
      tx.oncomplete = () => ok(req && req.result);
      tx.onerror = () => bad(tx.error);
    };
  });
  const getKey = () => store('readonly', (s) => s.get('device'));
  const putKey = (kp) => store('readwrite', (s) => s.put(kp, 'device'));
  const dropKey = () => store('readwrite', (s) => s.delete('device'));

  async function pair(token) {
    say('Pairing this phone…');
    const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
    await putKey(kp);
    try {
      await post('/gate/pair', { token, spki: b64(await crypto.subtle.exportKey('spki', kp.publicKey)) });
    } catch (e) { await dropKey(); throw e; }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }

  async function login(kp) {
    say('Signing in…');
    const { nonce } = await post('/gate/challenge');
    const msg = new TextEncoder().encode(`switchboard-phone-login\n${nonce}\n${location.origin}`);
    const sig = await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, kp.privateKey, msg);
    await post('/gate/login', { nonce, sig: b64(sig) });
    const next = new URLSearchParams(location.search).get('next') || '/';
    location.replace(/^\/(?!\/)/.test(next) ? next : '/');
  }

  async function run() {
    const token = new URLSearchParams(location.hash.slice(1)).get('pair');
    if (token) history.replaceState(null, '', location.pathname + location.search);  // the code is single use
    try {
      if (!window.crypto || !crypto.subtle || !window.indexedDB) throw new Error('This browser cannot hold a device key (it needs HTTPS and storage).');
      if (token) await pair(token);
      const kp = await getKey();
      if (!kp) {
        say('This browser is not paired.', true, 'In Switchboard on your computer, open Phone → Pair a phone and scan the code with this phone. Only one phone can be paired at a time.');
        $('retry').hidden = true;
        return;
      }
      await login(kp);
    } catch (e) {
      const notThis = /not the paired phone/.test(e.message);
      say(e.message, true, notThis ? 'Another phone (or browser) was paired after this one. Pair this phone again from your computer to use it.' : '');
    }
  }
  $('retry').addEventListener('click', run);
  window.addEventListener('hashchange', run);  // a new code opened while this page is already showing
  run();
})();
</script>
</body>
</html>
